name: Lean proof check

on:
  push:
    branches: [main]
    paths:
      - '**.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/lean.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Compile Lean and audit proof dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Check out the exact submitted revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free space on the disposable build runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Restore pinned Lean and compiled dependency cache
        id: dependencies
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.elan
            .lake/packages
          key: ${{ runner.os }}-lean-compiled-dependencies-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lean-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Install Lean version manager
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download the pinned Mathlib compiled dependencies
        id: mathlib
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake exe cache get

      - name: Compile every project library from source
        shell: bash
        run: |
          set -euo pipefail
          lake build 2>&1 | tee lean-build.log

      - name: Check the main theorem and planar proof axiom lists
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AxiomAudit.lean 2>&1 | tee axiom-audit.log
          awk '
            /depends on axioms:/ {
              count++
              line = $0
              sub(/^.*depends on axioms: \[/, "", line)
              sub(/\].*$/, "", line)
              gsub(/propext|Classical.choice|Quot.sound|[,[:space:]]/, "", line)
              if (length(line) != 0) { print "Unexpected proof dependency: " $0; bad = 1 }
            }
            END {
              if (count != 14) { print "Expected 14 axiom reports, received " count; bad = 1 }
              exit bad
            }
          ' axiom-audit.log

      - name: Record the successfully checked revision
        shell: bash
        run: |
          {
            printf '## Lean proof check\n\n'
            printf 'Checked source revision: `%s`\n\n' "$GITHUB_SHA"
            printf 'Every registered project library was compiled from source.\n\n'
            printf 'All 14 selected dependency reports contain only propext, Classical.choice, and Quot.sound.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save compiled dependencies even if a project proof needs repair
        if: always() && steps.mathlib.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.elan
            .lake/packages
          key: ${{ runner.os }}-lean-compiled-dependencies-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
