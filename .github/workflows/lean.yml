name: Lean proof check

on:
  push:
    branches: [main]
    paths:
      - '**.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/lean.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Compile Lean and audit proof dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Check out the exact submitted revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free space on the disposable build runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Restore pinned Lean and compiled dependency cache
        id: dependencies
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.elan
            .lake/packages
          key: ${{ runner.os }}-lean-compiled-dependencies-v3-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lean-compiled-dependencies-v2-
            ${{ runner.os }}-lean-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Install Lean version manager
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download the pinned Mathlib compiled dependencies
        id: mathlib
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake exe cache get

      - name: Compile every project library from source
        shell: bash
        run: |
          set -euo pipefail
          lake build 2>&1 | tee lean-build.log

      - name: Check the main theorem and planar proof axiom lists
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AxiomAudit.lean 2>&1 | tee axiom-audit.log
          awk '
            /depends on axioms:/ {
              count++
              line = $0
              sub(/^.*depends on axioms: \[/, "", line)
              sub(/\].*$/, "", line)
              gsub(/propext|Classical.choice|Quot.sound|[,[:space:]]/, "", line)
              if (length(line) != 0) { print "Unexpected proof dependency: " $0; bad = 1 }
            }
            END {
              if (count != 25) { print "Expected 25 axiom reports, received " count; bad = 1 }
              exit bad
            }
          ' axiom-audit.log

      - name: Record the successfully checked revision
        shell: bash
        run: |
          {
            printf '## Lean proof check\n\n'
            printf 'Checked source revision: `%s`\n\n' "$GITHUB_SHA"
            printf 'Every registered project library was compiled from source.\n\n'
            printf 'All 25 selected dependency reports contain only propext, Classical.choice, and Quot.sound.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save compiled dependencies even if a project proof needs repair
        if: always() && steps.mathlib.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.elan
            .lake/packages
          key: ${{ runner.os }}-lean-compiled-dependencies-v3-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Check source policy and complete module coverage
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t sources < <(git ls-files '*.lean')
          scan_status=0
          if command -v rg >/dev/null 2>&1; then
            rg -n '\b(sorry|admit|unsafe)\b|^\s*(private\s+|protected\s+)?axiom\b' -- "${sources[@]}" || scan_status=$?
          else
            git grep -n -E '(^|[^[:alnum:]_])(sorry|admit|unsafe)([^[:alnum:]_]|$)|^[[:space:]]*(private[[:space:]]+|protected[[:space:]]+)?axiom([^[:alnum:]_]|$)' -- '*.lean' || scan_status=$?
          fi
          if [[ "$scan_status" -ne 1 ]]; then
            printf 'Source policy scan did not complete cleanly (status %s).\n' "$scan_status" >&2
            exit 1
          fi
          for source in "${sources[@]}"; do
            if [[ "$source" == AxiomAudit.lean ]]; then
              continue
            fi
            artifact=".lake/build/lib/lean/${source%.lean}.olean"
            if [[ ! -f "$artifact" ]]; then
              printf 'Missing compiled module for %s\n' "$source" >&2
              exit 1
            fi
          done
          printf 'Source policy and module coverage checked for %s Lean files.\n' "${#sources[@]}"
